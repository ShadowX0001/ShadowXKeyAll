name: ShadowXKeyAll
version: '${version}'
main: com.shadowx.keyall.ShadowXKeyAll
api-version: '1.21'
authors: [ShadowX0001]
description: Multi-key timed crate distribution with persistent offline rewards.
softdepend: [PlaceholderAPI, ExcellentCrates, CrazyCrates, PhoenixCrates, Votifier, Vault]
commands:
  shadowxkeyall:
    description: ShadowXKeyAll main command and administration
    usage: /shadowxkeyall [status|start|stop|pause|resume|reload|give|giveall|set|reset|history|stats|preview|settings|boost]
    aliases: [keyall, ska]
permissions:
  shadowxkeyall.admin:
    description: Access all ShadowXKeyAll administration commands
    default: op
  shadowxkeyall.use:
    description: Open the ShadowXKeyAll timer GUI
    default: true
