# Each key is an independent timer. Commands are run from console.
# Modes: ONLINE_ONLY, OFFLINE_ONLY, ONLINE_AND_OFFLINE (BOTH is accepted as an alias).
keys:
  vote:
    enabled: true
    display-name: "&aVote Key"
    interval-seconds: 3600
    amount: 1
    mode: ONLINE_AND_OFFLINE
    commands:
      - "crazycrates give virtual vote %amount% %player%"
    permission: ""
    minimum-playtime-seconds: 0
    worlds-blacklist: []
    first-join-bonus: 0
    daily-bonus: 0
    weekly-bonus: 0
    monthly-bonus: 0
    streak-every-days: 7
    streak-bonus: 1
    lucky-chance-percent: 0.0
    lucky-extra-amount: 1
    dynamic-interval:
      enabled: false
      base-seconds: 3600
      seconds-per-online-player: 0
      min-seconds: 600
      max-seconds: 3600
  rare:
    enabled: false
    display-name: "&dRare Key"
    interval-seconds: 7200
    amount: 1
    mode: ONLINE_AND_OFFLINE
    commands:
      - "crazycrates give virtual rare %amount% %player%"
    permission: ""
    minimum-playtime-seconds: 0
    worlds-blacklist: []
    first-join-bonus: 0
    daily-bonus: 0
    weekly-bonus: 0
    monthly-bonus: 0
