# ShadowXKeyAll - all durations are seconds.
timer:
  interval-seconds: 3600
  start-on-enable: true
distribution:
  mode: ONLINE_AND_OFFLINE
  amount: 1
  key-id: vote
  commands:
    - "crazycrates give virtual %key% %amount% %player%"
eligibility:
  permission: ""
  minimum-playtime-seconds: 0
  require-not-afk: false
  afk-timeout-seconds: 300
  worlds-blacklist: []
countdown:
  bossbar: true
  bossbar-title: "&bShadowXKeyAll &8» &f%time%"
  bossbar-color: BLUE
  bossbar-style: SOLID
  actionbar: false
  chat-enabled: false
  chat-seconds: [60, 30, 10, 5, 4, 3, 2, 1]
  sounds-enabled: true
announcements:
  enabled: true
  before-seconds: [300, 60, 10]
storage:
  save-interval-seconds: 30
gui:
  title: "&8ShadowXKeyAll"
  size: 27
  info-slot: 13
  material: TRIPWIRE_HOOK
