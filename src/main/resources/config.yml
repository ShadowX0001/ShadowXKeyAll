# ShadowXKeyAll main settings. Durations are seconds.
timer:
  start-on-enable: true
  save-interval-seconds: 30
distribution:
  default-mode: ONLINE_AND_OFFLINE # ONLINE_ONLY, ONLINE_AND_OFFLINE, BOTH (per-key mode is in rewards.yml)
  retry-pending-on-join: true
eligibility:
  require-not-afk: false
  afk-timeout-seconds: 300
countdown:
  bossbar:
    enabled: true
    title: "&bShadowXKeyAll &8» &f%time%"
    color: BLUE
    style: SOLID
  actionbar:
    enabled: false
    message: "&bNext key in &f%time%"
  chat:
    enabled: false
    seconds: [60, 30, 10, 5, 4, 3, 2, 1]
  scoreboard:
    enabled: false
announcements:
  enabled: true
gui:
  enabled: true
  permission: shadowxkeyall.use
integrations:
  placeholderapi: true
  crate-command-fallback: true
anti-abuse:
  one-reward-per-cycle: true
