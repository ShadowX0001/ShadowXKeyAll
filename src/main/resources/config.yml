# ShadowXKeyAll - all durations are seconds unless stated otherwise.
timer:
  interval-seconds: 3600
  start-on-enable: true
  pause-during-maintenance: false
distribution:
  mode: ONLINE_AND_OFFLINE # ONLINE_ONLY, ONLINE_AND_OFFLINE
  amount: 1
  key-id: vote
  # Console commands run once per eligible player. Placeholders: %player%, %key%, %amount%
  commands:
    - "excellentcrates key give %player% %key% %amount%"
eligibility:
  permission: ""
  minimum-playtime-seconds: 0
  require-not-afk: false
  afk-timeout-seconds: 300
  worlds-blacklist: []
countdown:
  bossbar: true
  actionbar: false
  chat: false
announcements:
  enabled: true
  before-seconds: [300, 60, 10]
  warning: "&eKeyAll starts in &6%time%&e!"
  distributed: "&aShadowXKeyAll: &f%amount% %key% key(s) distributed to eligible players."
messages:
  prefix: "&8[&bShadowXKeyAll&8] "
  no-permission: "&cYou don't have permission."
  reloaded: "&aConfiguration reloaded."
  started: "&aTimer started."
  stopped: "&cTimer stopped."
  paused: "&eTimer paused."
  resumed: "&aTimer resumed."
  status: "&eNext KeyAll: &b%time%"
  help: "&7/keyall <status|start|stop|pause|resume|reload|give|giveall|preview>"
gui:
  title: "&8ShadowXKeyAll"
  size: 27
  info-slot: 13
  material: TRIPWIRE_HOOK
storage:
  save-interval-seconds: 30
