# ShadowXKeyAll configuration
# Durations are in seconds. Backup config.yml before editing.
timer:
  interval-seconds: 3600
  start-on-enable: true
distribution:
  # ONLINE_ONLY or ONLINE_AND_OFFLINE
  mode: ONLINE_AND_OFFLINE
  amount: 1
  key-id: vote
  # Console commands; supported tokens: %player%, %uuid%, %key%, %amount%
  # Adjust this command to match your crate plugin.
  commands:
    - "excellentcrates key give %player% %key% %amount%"
eligibility:
  permission: ""
  minimum-playtime-seconds: 0
  require-not-afk: false
  afk-timeout-seconds: 300
  worlds-blacklist: []
countdown:
  bossbar: true
  actionbar: false
announcements:
  enabled: true
  before-seconds: [300, 60, 10]
  warning: "&eKeyAll starts in &6%time%&e!"
  distributed: "&aShadowXKeyAll: &f%amount% %key% key(s) distributed. &7(Online: %online%, offline queued: %offline%)"
messages:
  prefix: "&8[&bShadowXKeyAll&8] "
  no-permission: "&cYou don't have permission."
  help: "&7/keyall <status|start|stop|pause|resume|reload|set|give|giveall|preview|pending|clearpending>"
gui:
  title: "&8ShadowXKeyAll"
  size: 27
  info-slot: 13
  material: TRIPWIRE_HOOK
storage:
  save-interval-seconds: 30
