# ShadowXKeyAll settings. Durations are seconds.
# Fallback reward commands used only when a key has no commands in rewards.yml.
# Available tokens: %player%, %uuid%, %key%, %key_name%, %amount%.
key-commands:
  default: []
  # Example for a crate plugin: ["crazycrates give virtual %key% %amount% %player%"]
  default-command: ""
timer:
  start-on-enable: true
  save-interval-seconds: 30
distribution:
  default-mode: ONLINE_AND_OFFLINE # ONLINE_ONLY, OFFLINE_ONLY, ONLINE_AND_OFFLINE
  retry-pending-on-join: true
eligibility:
  require-not-afk: false
  afk-timeout-seconds: 300
countdown:
  bossbar:
    enabled: true
    title: "&bShadowXKeyAll &8» &f%time%"
    color: BLUE
    style: SOLID
  actionbar:
    enabled: false
    message: "&bNext key in &f%time%"
  chat:
    enabled: false
    seconds: [60, 30, 10, 5, 4, 3, 2, 1]
  scoreboard:
    enabled: false
    title: "&b&lKEYALL"
announcements:
  enabled: true
gui:
  enabled: true
  permission: shadowxkeyall.use
integrations:
  placeholderapi: true
  discord:
    enabled: false
    webhook-url: ""
  voting:
    enabled: false
    amount: 1
    keys: [vote]
maintenance:
  enabled: false
