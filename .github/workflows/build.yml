name: Build
on:
  push:
    branches: [main, develop, shadowxkeyall-complete]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle clean build --no-daemon
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ShadowXKeyAll
          path: build/libs/*.jar
